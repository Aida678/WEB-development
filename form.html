<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Каталог</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/normalize.css">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <header>
        <span class="note-icon">🎵</span>
        <h1><a href="index.html" target="__blank"> Каталог музыкальных композиций</a></h1>
    </header>

    <nav>
        <ul>
            <li><a href="#about">О нас</a></li>
            <li><a href="#my_wave">Моя волна</a></li>
            <li><a href="#favorite">Избранное</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Регистрация</h2>

            <form action="#" method="post">
                <fieldset>
                    <legend>Заполните поля:</legend>

                    <div>
                        <label for="username"></label>
                        <input type="text" id="username" name="username" placeholder="Акакий Акакиевич" required>
                    </div>

                    <div>
                        <label for="birthdate">Дата рождения</label>
                        <input type="date" id="birthdate" name="birthdate">
                    </div>

                    <div>
                        <label>Пол:</label>
                        <input type="radio" id="male" name="gender" value="male">
                        <label for="male">Мужской</label>
                        <input type="radio" id="female" name="gender" value="female">
                        <label for="female">Женский</label>
                    </div>

                    <div>
                        <label for="password">Пароль:</label>
                        <input type="password" id="password" name="password" placeholder="Минимум 8 символов" required>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Контактные данные</legend>

                    <div>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" placeholder="example@mail.ru" required>
                    </div>

                    <div>
                        <label for="phone">Телефон:</label>
                        <input type="tel" id="phone" name="phone" placeholder="+7 (999) 123-45-67">
                    </div>

                    <div>
                        <label for="contact-time">Удобный интервал для связи:</label>
                        <select id="contact-time" name="contact-time">
                            <option value="morning">Утро</option>
                            <option value="day">День</option>
                            <option value="evening">Вечер</option>
                            <option value="night">Ночь</option>
                        </select>
                    </div>
                </fieldset>

                <button type="submit">📝 Зарегистрироваться</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Контакты:</p>
        <ul>
            <li><a href="mailto: pochtaMusic2424@gmail.com">e-mail</a></li>
            <li><a href="tel: +7 999 999 11 22">Телефон для связи: +7 999 999 11 22</a></li>
            <li><a href="form.html">Зарегистрироваться</a></li>
        </ul>
    </footer>

</body>
</html>
